<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="Utensil Design System Reference" />
  <meta name="author" content="Gobi Stories AS" />
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Utensil Design System</title>

  <!-- Preload critical fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Reference UI -->
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Reference Article -->
  <link
    href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap"
    rel="stylesheet">

  <!-- Reference Code -->
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,900;1,200;1,300;1,400;1,500;1,600;1,700;1,900&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --background-color: #fff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      color: #212529;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background-color: rgb(14, 17, 22);
        color: #f8f9fa;
      }
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: var(--background-color);
    }

    #app {
      min-height: 100vh;
    }

    /* Print styles */
    @media print {
      * {
        background: transparent !important;
        color: black !important;
        box-shadow: none !important;
        text-shadow: none !important;
      }

      a,
      a:visited {
        text-decoration: underline;
      }

      a[href]:after {
        content: " (" attr(href) ")";
      }

      pre {
        white-space: pre-wrap !important;
      }
    }
  </style>
</head>

<body>
  <noscript>
    <div style="
      padding: 2rem;
      text-align: center;
      background-color: #f8d7da;
      line-height: 1.15;
      color: #721c24;
      border: 1px solid #f5c6cb;
      border-radius: 0.375rem;
      margin: 2rem;
    ">
      <h2>JavaScript Required</h2>
      <p>
        <strong>Utensil Reference</strong> requires JavaScript to function properly.
        Please enable JavaScript in your browser settings and refresh the page.
      </p>
    </div>
  </noscript>

  <div id="app"></div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
