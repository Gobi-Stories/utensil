services:
  utensil-reference:
    build:
      context: .
      dockerfile: apps/reference/Dockerfile
      target: dev
    # Build on every up, so the source and dependencies in the image are always current
    pull_policy: build
    environment:
      APP_ENVIRONMENT: development
      PORT: ${UTENSIL_REFERENCE_PORT:-12911}
    ports:
      - "0.0.0.0:${UTENSIL_REFERENCE_PORT:-12911}:${UTENSIL_REFERENCE_PORT:-12911}"
    # docker compose up --watch: sync source edits into the container, and rebuild the image when the dependencies or
    # the image's own files change. The host's node_modules never reaches the container (.dockerignore): its native
    # binaries are built for the host's platform, not the container's.
    develop:
      watch:
        - action: rebuild
          path: bun.lock
        - action: rebuild
          path: apps/reference/Dockerfile
        - action: rebuild
          path: apps/reference/development.sh
        - action: rebuild
          path: apps/reference/entrypoint.sh
        - action: sync
          path: .
          target: /app

  # Production build of the reference app, served by nginx: docker compose --profile product up
  utensil-reference-product:
    profiles: ["product"]
    build:
      context: .
      dockerfile: apps/reference/Dockerfile
      target: product
    environment:
      PORT: 8080
    ports:
      - "0.0.0.0:${UTENSIL_REFERENCE_PRODUCT_PORT:-12912}:8080"
